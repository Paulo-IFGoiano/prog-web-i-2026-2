<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroVale — Catálogo de Produtos</title>
  <style>
    :root {
      --verde:  #1E5631;
      --verde2: #2d7a46;
      --areia:  #FAF9F4;
      --ambar:  #c8922a;
      --cinza:  #6b7280;
      --borda:  #d1d5db;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--areia); color: #222; }

    /* ── CABEÇALHO ── */
    header {
      background: var(--verde);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .logo { font-size: 1.4rem; font-weight: 700; }
    header .logo span { color: #a3e6b8; }
    header p { font-size: 13px; opacity: .75; margin-top: 2px; }

    /* ── BARRA DE BUSCA ── */
    .barra-busca {
      background: #fff;
      padding: 16px 32px;
      border-bottom: 1px solid var(--borda);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #input-busca {
      flex: 1;
      max-width: 400px;
      padding: 10px 14px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      font-size: 15px;
    }
    #input-busca:focus { outline: 2px solid var(--verde); border-color: var(--verde); }
    #info-resultado { font-size: 13px; color: var(--cinza); }

    /* ── CONTEÚDO PRINCIPAL ── */
    main { padding: 24px 32px; }

    /* ── CATÁLOGO — GRID DE CARDS ── */
    #catalogo {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 18px 20px;
      width: 220px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .card.selecionado { border-color: var(--verde); box-shadow: 0 0 0 2px var(--verde); }

    .card .categoria {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--cinza);
      margin-bottom: 6px;
    }
    .card h3 { font-size: 14px; color: #1a1a2e; margin-bottom: 8px; line-height: 1.3; }
    .card .preco { font-size: 1.1rem; font-weight: 700; color: var(--ambar); margin-bottom: 6px; }
    .card .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .card .badge.disponivel { background: #d1fae5; color: #065f46; }
    .card .badge.indisponivel { background: #fee2e2; color: #991b1b; }

    /* ── PAINEL DE DETALHES ── */
    #painel-detalhe {
      position: fixed;
      top: 0; right: 0;
      width: 320px;
      height: 100vh;
      background: #fff;
      border-left: 1px solid var(--borda);
      box-shadow: -4px 0 24px rgba(0,0,0,.12);
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform .25s;
    }
    #painel-detalhe.oculto { transform: translateX(100%); }

    #painel-detalhe .painel-cabecalho {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    #painel-detalhe h2 { font-size: 1rem; color: var(--verde); }
    #btn-fechar {
      background: none;
      border: 1px solid var(--borda);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 18px;
      cursor: pointer;
      color: #666;
    }
    #btn-fechar:hover { background: #f3f4f6; }

    #detalhe-conteudo { flex: 1; overflow-y: auto; }
    #detalhe-conteudo .linha {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    #detalhe-conteudo .linha .chave { color: var(--cinza); }
    #detalhe-conteudo .linha .valor { font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="logo">🌱 Agro<span>Vale</span></div>
      <p>Catálogo de Produtos Agrícolas</p>
    </div>
  </header>

  <div class="barra-busca">
    <input type="text" id="input-busca" placeholder="🔍 Buscar produto...">
    <span id="info-resultado">Carregando...</span>
  </div>

  <main>
    <div id="catalogo">
      <!-- Cards gerados dinamicamente pelo JS -->
    </div>
  </main>

  <!-- Painel de detalhes (inicialmente oculto) -->
  <div id="painel-detalhe" class="oculto">
    <div class="painel-cabecalho">
      <h2>Detalhes do Produto</h2>
      <button id="btn-fechar">✕</button>
    </div>
    <div id="detalhe-conteudo">
      <!-- Preenchido pelo JS -->
    </div>
  </div>

  <script src="AP14_app.js" defer></script>
</body>
</html>
