<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Aula 13 — Funções</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f0f0f0; }
    h1 { color: #1a3a5c; }
    .caixa { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-right: 8px; }
    button { padding: 8px 16px; background: #2563a8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1a3a5c; }
    #resultado { font-size: 1.1rem; color: #333; min-height: 24px; }
    #lista-notas { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    #lista-notas ul { padding-left: 20px; }
  </style>
</head>
<body>

  <h1>Demo — Funções</h1>

  <!-- Bloco 1: Saudação -->
  <div class="caixa">
    <h2>Saudação</h2>
    <input type="text" id="input-nome" placeholder="Seu nome">
    <button id="btn-saudar">Saudar</button>
    <p id="resultado-saudacao"></p>
  </div>

  <!-- Bloco 2: Calculadora de média -->
  <div class="caixa">
    <h2>Calculadora de Média</h2>
    <input type="number" id="input-nota1" placeholder="Nota 1" style="width:80px">
    <input type="number" id="input-nota2" placeholder="Nota 2" style="width:80px">
    <input type="number" id="input-nota3" placeholder="Nota 3" style="width:80px">
    <button id="btn-media">Calcular</button>
    <p id="resultado-media"></p>
  </div>

  <!-- Bloco 3: Resultado geral -->
  <div class="caixa">
    <h2>Resultado</h2>
    <p id="resultado"></p>
  </div>

  <script src="demo_aula13_script.js"></script>
</body>
</html>
